[build]
  command = "npm run build"
  publish = ".next"

# Next 16 / Turbopack guarda valores de env no cache (.sst); o scan trata isso como leak.
# NEXT_PUBLIC_* também aparece no bundle cliente (de propósito).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,.next/cache/**,.netlify/.next/cache/**"
  SECRETS_SCAN_OMIT_KEYS = "META_PAGE_ACCESS_TOKEN,SUPABASE_SERVICE_ROLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_SITE_URL,NETLIFY_AUTH_TOKEN,INSTAGRAM_BUSINESS_ACCOUNT_ID,META_PAGE_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keep brand/favicon assets revalidatable so icon rollouts are not stuck in Durable Cache.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/icon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/apple-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

# HUB-86: store.padel1.app — host rewrite is in Next proxy (src/proxy.ts).
# Netlify domain-level 301s as belt-and-suspenders for SE → canonical store.
# (App Router + @netlify/plugin-nextjs: prefer proxy over /* → /store 200 rewrites.)

[[redirects]]
  from = "https://sportsevents.app/store"
  to = "https://store.padel1.app/"
  status = 301
  force = true

[[redirects]]
  from = "https://sportsevents.app/store/*"
  to = "https://store.padel1.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sportsevents.app/store"
  to = "https://store.padel1.app/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sportsevents.app/store/*"
  to = "https://store.padel1.app/:splat"
  status = 301
  force = true

# Duplicate /store on the store host → public root (also in proxy)
[[redirects]]
  from = "https://store.padel1.app/store"
  to = "https://store.padel1.app/"
  status = 301
  force = true

[[redirects]]
  from = "https://store.padel1.app/store/*"
  to = "https://store.padel1.app/:splat"
  status = 301
  force = true
