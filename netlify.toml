[build]
  command = "npm run build"
  publish = ".next"

# Next 16 / Turbopack guarda valores de env no cache (.sst); o scan trata isso como leak.
# NEXT_PUBLIC_* também aparece no bundle cliente (de propósito).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,.next/cache/**,.netlify/.next/cache/**"
  SECRETS_SCAN_OMIT_KEYS = "META_PAGE_ACCESS_TOKEN,SUPABASE_SERVICE_ROLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_SITE_URL,NETLIFY_AUTH_TOKEN,INSTAGRAM_BUSINESS_ACCOUNT_ID,META_PAGE_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keep brand/favicon assets revalidatable so icon rollouts are not stuck in Durable Cache.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/icon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/apple-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=86400, durable"
